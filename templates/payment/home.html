{% extends "base.html" %}

{% block title %}Checkout Seguro{% endblock %}

{% block content %}
<div class="container mx-auto mt-10">
    <div class="flex flex-col md:flex-row gap-10">
        
        <div class="md:w-2/3">
            <h2 class="text-2xl font-bold mb-5">Endereço de Entrega</h2>
            <form id="payment-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Nome Completo</label>
                    <input type="text" id="custName" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2" value="{{ user.first_name }} {{ user.last_name }}" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Email</label>
                    <input type="email" id="email" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2" value="{{ user.email }}" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Endereço (Rua, Número)</label>
                    <input type="text" id="address1" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2" placeholder="Av. Paulista, 1000" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Complemento</label>
                    <input type="text" id="address2" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2" placeholder="Apto 101">
                </div>
                <div class="flex gap-4">
                    <div class="w-1/2">
                        <label class="block text-sm font-medium text-gray-700">Cidade</label>
                        <input type="text" id="city" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2" required>
                    </div>
                    <div class="w-1/2">
                        <label class="block text-sm font-medium text-gray-700">CEP</label>
                        <input type="text" id="post_code" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2" required>
                    </div>
                </div>
            </form>
        </div>

        <div class="md:w-1/3 bg-gray-50 p-6 rounded-lg h-fit border">
            <h3 class="text-lg font-bold mb-4">Resumo</h3>
            <div class="flex justify-between mb-2">
                <span>Subtotal</span>
                <span>R$ {{ total }}</span>
            </div>
            <div class="flex justify-between mb-6 font-bold text-xl">
                <span>Total a Pagar</span>
                <span>R$ {{ total }}</span>
            </div>

            <button id="submit-order" class="w-full bg-green-600 text-white py-3 rounded-md font-bold hover:bg-green-700 transition">
                Pagar Agora
            </button>
            <p class="text-xs text-center text-gray-400 mt-2">Ambiente Seguro</p>
        </div>
    </div>
</div>

<script>
    // Aqui conectamos o botão com o Backend
    document.getElementById('submit-order').addEventListener('click', function(e) {
        e.preventDefault();

        var name = document.getElementById("custName").value;
        var email = document.getElementById("email").value;
        var address1 = document.getElementById("address1").value;
        var address2 = document.getElementById("address2").value;
        var city = document.getElementById("city").value;
        var post_code = document.getElementById("post_code").value;
        var csrfToken = '{{ csrf_token }}';

        // Validação simples
        if (address1 === "" || city === "") {
            alert("Por favor, preencha o endereço.");
            return;
        }

        // Simula o envio para a API de Pedidos
        fetch('{% url "orders:add" %}', {
            method: 'POST',
            body: JSON.stringify({
                order_key: 'Simulacao_' + Date.now(), // Gera um ID único falso para teste
                name: name,
                email: email,
                address1: address1,
                address2: address2,
                city: city,
                post_code: post_code,
                csrfmiddlewaretoken: csrfToken,
                action: 'post'
            }),
            headers: {
                "X-CSRFToken": csrfToken,
                "Content-Type": "application/x-www-form-urlencoded" // Importante para Django ler o POST padrão
            }
        })
        // ... (código anterior do fetch permanece igual)
        .then(response => {
             let formData = new FormData();
             formData.append('full_name', name);
             formData.append('email', email);
             formData.append('address1', address1);
             formData.append('address2', address2);
             formData.append('city', city);
             formData.append('post_code', post_code);
             formData.append('order_key', 'PEDIDO_' + Date.now()); // Gera um ID único
             formData.append('csrfmiddlewaretoken', csrfToken);
             formData.append('action', 'post');
             
             return fetch('{% url "orders:add" %}', {
                 method: 'POST',
                 body: formData
             });
        })
        // ... (resto do código permanece igual)
        .then(response => response.json())
        .then(data => {
            if(data.success) {
                window.location.href = "{% url 'accounts:dashboard' %}";
            }
        })
        .catch(error => console.error('Error:', error));
    });
</script>
{% endblock %}
