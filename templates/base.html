<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      {% block title %}
        Renata Dmaria
      {% endblock %}
    </title>

    <script src="https://cdn.tailwindcss.com"></script>

    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
  </head>
  <body class="bg-gray-50 text-gray-900 antialiased">
    <nav class="bg-white shadow p-4 mb-8">
      <div class="container mx-auto flex justify-between items-center">
        <a href="/" class="text-2xl font-bold text-pink-600">Renata Dmaria</a>
        <div>
          <a href="#" class="px-4 hover:text-pink-600">Loja</a>
          <a href="{% url 'basket:basket_summary' %}" class="px-4 hover:text-pink-600">Carrinho (<span id="basket-qty">{{ basket|length }}</span>)</a>
          {% if user.is_authenticated %}
            <a href="{% url 'accounts:dashboard' %}" class="px-4 hover:text-pink-600">Minha Conta</a>
            <form action="{% url 'accounts:logout' %}" method="post" class="inline">
              {% csrf_token %}
              <button type="submit" class="px-4 text-gray-500 hover:text-red-600 text-sm bg-transparent border-0 cursor-pointer">Sair</button>
            </form>
          {% else %}
            <a href="{% url 'accounts:login' %}" class="px-4 hover:text-pink-600">Login</a>
          {% endif %}
        </div>
      </div>
    </nav>

    <main class="container mx-auto px-4">
      {% block content %}

      {% endblock %}
    </main>

    <footer class="mt-12 p-8 text-center text-gray-500 text-sm">&copy; 2026 Renata Dmaria. Todos os direitos reservados.</footer>

    <script>
      document.body.addEventListener('htmx:configRequest', (event) => {
        event.detail.headers['X-CSRFToken'] = '{{ csrf_token }}'
      })
    </script>
  </body>
</html>
