{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-10 bg-white p-8 border border-gray-200 rounded-lg shadow-sm">
    <h1 class="text-2xl font-bold mb-6 text-center">Acesse sua conta</h1>
    
    <form method="post" action="{% url 'accounts:login' %}">
        {% csrf_token %}
        {{ form.as_p }}
        
        <input type="hidden" name="next" value="{{ next }}">
        
        <button type="submit" class="w-full bg-pink-600 text-white font-bold py-2 px-4 rounded hover:bg-pink-700 transition">
            Entrar
        </button>
    </form>
    
    <p class="mt-4 text-center text-sm text-gray-600">
        Não tem conta? <a href="{% url 'accounts:register' %}" class="text-pink-600 font-bold">Cadastre-se</a>
    </p>
</div>
{% endblock %}
