{% extends "base.html" %}

{% block title %}Criar Conta{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-10 bg-white p-8 border border-gray-200 rounded-lg shadow-sm">
    <h1 class="text-2xl font-bold mb-6 text-center">Criar Nova Conta</h1>
    
    <form method="post">
        {% csrf_token %}
        {% if form.errors %}
        <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4">
            <p>Por favor, corrija os erros abaixo.</p>
        </div>
        {% endif %}
        
        {{ form.as_p }}
        
        <button type="submit" class="w-full bg-green-600 text-white font-bold py-2 px-4 rounded hover:bg-green-700 transition">
            Registrar
        </button>
    </form>
</div>
{% endblock %}
