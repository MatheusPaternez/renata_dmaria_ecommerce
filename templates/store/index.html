{% extends "base.html" %}

{% block title %}Renata Dmaria - Loja Oficial{% endblock %}

{% block content %}
<div class="my-8">
    <h2 class="text-2xl font-bold mb-6 text-gray-800">Novidades</h2>
    
    <div class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-6">
        {% for product in products %}
        <div class="group bg-white rounded-lg shadow-sm hover:shadow-md transition-shadow overflow-hidden">
            <a href="{{ product.get_absolute_url }}">
                <div class="aspect-w-1 aspect-h-1 w-full overflow-hidden bg-gray-200 xl:aspect-w-7 xl:aspect-h-8">
                    <img src="{{ product.image.url }}" alt="{{ product.title }}" class="h-64 w-full object-cover object-center group-hover:opacity-75">
                </div>
                <div class="p-4">
                    <h3 class="mt-1 text-lg font-medium text-gray-900">{{ product.title }}</h3>
                    <p class="mt-1 text-sm text-gray-500">{{ product.author }}</p>
                    <p class="mt-2 text-xl font-bold text-gray-900">R$ {{ product.price }}</p>
                </div>
            </a>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
