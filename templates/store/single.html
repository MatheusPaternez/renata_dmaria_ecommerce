{% extends 'base.html' %}

{% block title %}
  {{ product.title }}
{% endblock %}

{% block content %}
  <div class="bg-white">
    <div class="pt-6 pb-16 sm:pb-24">
      <div class="mt-8 max-w-2xl mx-auto px-4 sm:px-6 lg:max-w-7xl lg:px-8">
        <div class="lg:grid lg:grid-cols-2 lg:gap-x-8 lg:items-start">
          <div class="flex flex-col-reverse">
            <div class="w-full aspect-w-1 aspect-h-1">
              <img src="{{ product.image.url }}" alt="{{ product.title }}" class="w-full h-full object-center object-cover rounded-lg shadow-lg" />
            </div>
          </div>

          <div class="mt-10 px-4 sm:px-0 sm:mt-16 lg:mt-0">
            <h1 class="text-3xl font-extrabold tracking-tight text-gray-900">{{ product.title }}</h1>

            <div class="mt-3">
              <p class="text-3xl text-gray-900">R$ {{ product.price }}</p>
            </div>

            <div class="mt-6">
              <h3 class="sr-only">Descrição</h3>
              <div class="text-base text-gray-700 space-y-6">{{ product.description|linebreaks }}</div>
            </div>

            <div class="mt-10 flex">
              <select id="select-qty" class="mr-4 border border-gray-300 rounded-md py-3 px-4">
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
              </select>

              <button type="button" id="add-button" value="{{ product.id }}" class="max-w-xs flex-1 bg-pink-600 border border-transparent rounded-md py-3 px-8 flex items-center justify-center text-base font-medium text-white hover:bg-pink-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-pink-500 sm:w-full">Adicionar ao Carrinho</button>
            </div>

            <script>
              // Captura o clique no botão
              document.getElementById('add-button').addEventListener('click', function (e) {
                e.preventDefault()
              
                // Dados para enviar
                let formData = new FormData()
                formData.append('productid', document.getElementById('add-button').value)
                formData.append('productqty', document.getElementById('select-qty').value)
                formData.append('csrfmiddlewaretoken', '{{ csrf_token }}')
                formData.append('action', 'post')
              
                // Envio via Fetch API (Padrão moderno)
                fetch('{% url "basket:basket_add" %}', {
                  method: 'POST',
                  body: formData
                })
                  .then((response) => response.json())
                  .then((data) => {
                    // Atualiza o contador lá no menu (NavBar)
                    document.getElementById('basket-qty').innerText = data.qty
              
                    // Feedback visual (opcional)
                    let btn = document.getElementById('add-button')
                    btn.innerText = 'Adicionado!'
                    btn.classList.remove('bg-pink-600')
                    btn.classList.add('bg-green-600')
                  })
                  .catch((error) => console.error('Error:', error))
              })
            </script>
          </div>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
